name: Deploy CFB Apex site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-apex-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - name: Install site dependencies
        run: npm ci
      - name: Verify source snapshot and site
        run: npm run verify
      - name: Check committed generated site dataset
        run: git diff --exit-code --stat -- lib/cfb-2026.generated.ts
      - name: Check Cloudflare types
        run: npm run cf:types
      - name: Validate deployment bundle without publishing
        run: npm run deploy:dry-run
      - name: Freshly verify reviewed GameDay results and records
        run: npm run gameday:source-gate
      - name: Audit production site dependencies
        run: npm audit --omit=dev --fetch-retries=0 --fetch-timeout=20000
      - name: Check production credentials
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Production was not deployed: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.'
            exit 1
          fi
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "820e7cee61fccc60d14c8e20bc686942" ]; then
            echo '::error::Production account does not match the verified CFB Apex account.'
            exit 1
          fi
      - name: Deploy verified build to CFBAPEX.COM
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.jsonc
      - name: Check production snapshot across surfaces
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const snapshot = JSON.parse(readFileSync('data/cfb-2026/refresh/verified-refresh.json', 'utf8'));
          import { withoutHtmlComments as clean } from './scripts/gameday-source-validation.mjs';
          const cacheBust = '?release=' + encodeURIComponent(snapshot.audit_applied_at ?? snapshot.retrieved_at);
          // A new Worker version takes a few seconds to reach every edge, so
          // wait (up to two minutes) for this release before asserting on it.
          let home;
          let homeHtml = '';
          let lastError;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              home = await fetch('https://cfbapex.com/' + cacheBust + '&attempt=' + attempt);
              homeHtml = clean(await home.text());
              if (home.status === 200 && homeHtml.includes(snapshot.reference_date) && homeHtml.includes(snapshot.retrieved_at)) break;
            } catch (error) {
              // A transient connection failure is retried like a stale edge.
              lastError = error;
            }
            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }
          assert.ok(home, 'homepage unreachable: ' + (lastError?.message ?? 'no response'));
          assert.equal(home.status, 200, 'homepage');
          assert.ok(homeHtml.includes(snapshot.reference_date), 'Production snapshot date is stale');
          assert.ok(homeHtml.includes(snapshot.retrieved_at), 'Production source retrieval timestamp is stale');

          // The default board follows the server clock: once a board week's
          // cutover passes, the homepage must show that week.
          const boards = snapshot.board_weeks ?? [];
          const live = boards.filter((row) => Date.now() >= Date.parse(row.cutover_utc)).at(-1);
          if (live) assert.ok(homeHtml.includes(`WEEK ${live.week} · ${live.label.toUpperCase()}`), `Homepage is not on Week ${live.week}`);
          assert.match(home.headers.get('cache-control') ?? '', /no-store/, 'clock-dependent homepage must not be cached');
          const marquee = boards.find((row) => row.marquee_game_id)?.marquee_game_id;
          if (marquee) {
            const page = await fetch('https://cfbapex.com/games/' + marquee + cacheBust);
            assert.equal(page.status, 200, 'marquee game page ' + marquee);
          }

          const rankings = await fetch('https://cfbapex.com/rankings' + cacheBust);
          assert.equal(rankings.status, 200, 'rankings page');
          const rankingsHtml = clean(await rankings.text());
          const poll = snapshot.polls.find((entry) => entry.poll === 'ap');
          for (const row of poll.rankings.slice(0, 5)) {
            assert.ok(rankingsHtml.includes(row.team), 'rankings page is missing ' + row.team);
          }
          assert.ok(!/\b0\s+others receiving votes/i.test(rankingsHtml), 'rankings page prints zero others receiving votes');

          // One game page must carry the same verified retrieval time.
          // The game may be upcoming or already a verified final.
          const scheduled = snapshot.scheduledGames.find((row) => row.home === 'alabama' && row.away === 'georgia');
          const played = snapshot.playedGames.find((row) => row.home_slug === 'alabama' && row.away_slug === 'georgia' && row.date === '2026-10-10');
          const game = scheduled ?? played;
          assert.ok(game, 'Georgia at Alabama is in the snapshot');
          const gameId = scheduled ? `${game.date}-${game.away}-at-${game.home}` : played.game_id;
          const gamePage = await fetch('https://cfbapex.com/games/' + gameId + cacheBust);
          assert.equal(gamePage.status, 200, 'game page ' + gameId);
          const gameHtml = clean(await gamePage.text());
          assert.ok(gameHtml.includes(game.kickoff_utc.slice(0, 10)), 'game page kickoff date missing');
          console.log('Production verified across home, rankings and game page:', snapshot.retrieved_at);
          JS
      - name: Verify exact public GameDay data revision and archive parity
        if: github.event_name != 'pull_request'
        run: node --experimental-strip-types scripts/smoke-gameday.mjs
